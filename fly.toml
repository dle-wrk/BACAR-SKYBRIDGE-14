# fly.toml app configuration file for bacar-skybridge-14
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bacar-skybridge-14'
primary_region = 'jnb'
kill_timeout = '60s'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # 1 keeps a machine warm so the first visitor after idle doesn't wait on a cold
  # start. Set to 0 to save money on a demo that can tolerate a few seconds.
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

# Static asset serving needs very little. Only one memory key is legal — the
# original file set both `memory = '1gb'` and `memory_mb = 256`.
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1370" viewBox="0 0 680 685" role="img">
<title>18650 battery capacity tester schematic</title>
<desc>18650 cell to INA219 high-side shunt, 4 ohm load and IRL520N low-side switch driven from Arduino D5. INA219 on I2C A4/A5. ST7735 OLED on hardware SPI through a 4-channel level shifter. TP4056 charger across the cell.</desc>
<style>
  text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
  .t  { font-size: 14px; fill: #222; }
  .th { font-size: 14px; font-weight: 600; fill: #222; }
  .ts { font-size: 12px; fill: #555; }
  .c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
  .c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
  .c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
  .c-gray > .th { fill: #444441; } .c-gray > .ts { fill: #5F5E5A; }
  rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
  rect.c-gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.8; }
</style>
<rect width="680" height="685" fill="#ffffff"/>

